<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Architecture locale Windows / WSL 2 / Docker</title>
<desc id="desc">Dans Windows, VS Code accède aux fichiers du projet dans Ubuntu sous WSL 2. Docker Desktop utilise un moteur WSL 2 distinct d’Ubuntu. Les fichiers sont montés dans le conteneur Laravel, connecté aux conteneurs PostgreSQL, Redis et Mailpit. Le navigateur accède à Laravel.</desc>
<defs>
 <style>text{font-family:Arial,Helvetica,sans-serif;fill:#18202b;font-size:25px}.heading{font-size:29px;font-weight:700}.label{font-size:21px;fill:#596473}.box{fill:#fff;stroke:#263445;stroke-width:2}.link{fill:none;stroke:#263445;stroke-width:2;marker-end:url(#arrow)}</style>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#263445" stroke-width="1.3"/></marker>
</defs>
