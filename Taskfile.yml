# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  local:build:dev:
    desc: Build dev image locally
    aliases:
      - build
    cmds:
      - docker buildx bake -f bake.hcl local

  local:compose:down:
    desc: Remove the local Compose stack
    cmds:
      - docker compose -f local/compose.yaml down

  published:compose:up: &compose-up
    desc: Create the Compose stack with the published image
    aliases:
      - up-pub
    deps:
      - local:compose:down
    cmds:
      - docker compose -f local/compose.yaml up --remove-orphans -d

  local:compose:up:
    <<: *compose-up
    desc: Create the Compose stack with the local image
    aliases:
      - up
    env:
      IMAGE: iut-student-workspace:latest

  local:terminal:
    desc: Open a terminal into the local Compose stack's application container
    aliases:
      - term
    cmds:
      - docker exec -it weather-application /usr/bin/fish
